<div id="personal-browser-concept" class="viz-carousel viz-dotted-background" aria-label="Combray browser designs">
  <section data-variant="Recent sheet" aria-label="Combray with a recent pages sheet">
    <div class="pb-stage"><div class="pb" data-layout="sheet" aria-label="Combray Recent sheet preview"></div></div>
  </section>
  <section data-variant="Recent home" aria-label="Combray with recent pages as its home screen" hidden>
    <div class="pb-stage"><div class="pb" data-layout="home" aria-label="Combray Recent home preview"></div></div>
  </section>
</div>
<style>
#personal-browser-concept .pb-stage{display:flex;justify-content:center;padding:22px 8px;min-height:690px;box-sizing:border-box}
#personal-browser-concept .pb{color-scheme:light dark;--pb-bg:light-dark(#f7f6f2,#191c1c);--pb-panel:light-dark(#ffffff,#242929);--pb-text:light-dark(#202a28,#edf1ee);--pb-muted:light-dark(#66736d,#adbab3);--pb-line:light-dark(#e3e7e1,#3e4844);--pb-accent:light-dark(#215e4a,#b5ddc9);--pb-onaccent:light-dark(#ffffff,#163c2d);--pb-soft:light-dark(#e9f0e9,#303f37);--pb-cover:light-dark(#cbd4cc,#39433c);position:relative;width:100%;max-width:368px;height:652px;border:1px solid var(--pb-line);border-radius:26px;overflow:hidden;background:var(--pb-bg);color:var(--pb-text);font:400 14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 14px 44px light-dark(#26382b18,#00000044)}
#personal-browser-concept .pb *{box-sizing:border-box}
#personal-browser-concept .pb button,#personal-browser-concept .pb input{font:inherit;color:inherit}
#personal-browser-concept .pb button{background:none;border:0;padding:0;cursor:inherit}
#personal-browser-concept .pb button:focus-visible,#personal-browser-concept .pb input:focus-visible{outline:2px solid var(--pb-accent);outline-offset:3px}
#personal-browser-concept .pb .pb-status{display:flex;justify-content:space-between;padding:15px 23px 9px;font-size:12px;font-weight:500}
#personal-browser-concept .pb .pb-status span:last-child{letter-spacing:2px}
#personal-browser-concept .pb .pb-article{padding:28px 26px}
#personal-browser-concept .pb .pb-eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--pb-muted);margin-bottom:14px}
#personal-browser-concept .pb .pb-article h2{font:400 31px/1.12 Georgia,serif;letter-spacing:-.5px;margin:0 0 18px;color:var(--pb-text)}
#personal-browser-concept .pb .pb-article p{color:var(--pb-muted);margin:0 0 18px}
#personal-browser-concept .pb .pb-art{height:109px;border-radius:7px;background:var(--pb-cover);position:relative;overflow:hidden;margin:20px 0}
#personal-browser-concept .pb .pb-art::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:var(--pb-accent);opacity:.35;left:30px;top:30px}
#personal-browser-concept .pb .pb-art::after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--pb-panel);opacity:.65;right:30px;top:-22px}
#personal-browser-concept .pb .pb-rule{height:7px;background:var(--pb-line);margin:12px 0;border-radius:4px}
#personal-browser-concept .pb .pb-scrim{position:absolute;inset:39px 0 91px;background:light-dark(#142a2429,#00000050)}
#personal-browser-concept .pb .pb-sheet{position:absolute;left:0;right:0;bottom:91px;background:var(--pb-panel);border-radius:23px 23px 0 0;padding:10px 14px 14px;box-shadow:0 -4px 20px light-dark(#233f2910,#00000025)}
#personal-browser-concept .pb .pb-handle{width:32px;height:4px;border-radius:4px;background:var(--pb-line);margin:0 auto 16px}
#personal-browser-concept .pb .pb-sheet h3{font-size:20px;line-height:1.2;font-weight:500;margin:0 0 5px;padding:0 7px}
#personal-browser-concept .pb .pb-sub{color:var(--pb-muted);font-size:12px;padding:0 7px;margin:0 0 12px}
#personal-browser-concept .pb .pb-page-row{display:flex;align-items:center;gap:10px;min-height:var(--pb-row-height,65px);border-bottom:1px solid var(--pb-line)}
#personal-browser-concept .pb .pb-page-open{display:flex;align-items:center;gap:10px;text-align:left;flex:1;min-width:0;min-height:calc(var(--pb-row-height,65px) - 5px);padding:4px 6px;border-radius:9px}
#personal-browser-concept .pb .pb-page-open:hover{background:var(--pb-soft)}
#personal-browser-concept .pb .pb-favicon{flex:0 0 32px;display:grid;place-items:center;height:32px;border-radius:9px;background:var(--pb-soft);color:var(--pb-accent);font-size:14px;font-weight:500}
#personal-browser-concept .pb .pb-copy{display:block;min-width:0;flex:1}
#personal-browser-concept .pb .pb-title{display:block;font-weight:500;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
#personal-browser-concept .pb .pb-meta{display:block;color:var(--pb-muted);font-size:11px;margin-top:4px}
#personal-browser-concept .pb .pb-live{display:inline-block;color:var(--pb-accent);margin-left:5px;font-weight:500}
#personal-browser-concept .pb .pb-close{width:40px;min-height:44px;color:var(--pb-muted);display:grid;place-items:center}
#personal-browser-concept .pb .pb-close:hover{background:var(--pb-soft);border-radius:10px}
#personal-browser-concept .pb .pb-sheet-footer{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:14px}
#personal-browser-concept .pb .pb-link{color:var(--pb-accent);font-weight:500;min-height:44px;padding:0 7px}
#personal-browser-concept .pb .pb-plus{background:var(--pb-soft);border-radius:12px;padding:0 14px;min-height:44px;font-weight:500}
#personal-browser-concept .pb .pb-dock{position:absolute;bottom:0;left:0;right:0;height:91px;padding:12px 9px 27px;background:var(--pb-panel);border-top:1px solid var(--pb-line);display:flex;gap:4px;align-items:center}
#personal-browser-concept .pb .pb-dock::after{content:"";position:absolute;bottom:10px;left:calc(50% - 45px);height:4px;width:90px;border-radius:5px;background:var(--pb-text);opacity:.7}
#personal-browser-concept .pb .pb-icon{width:40px;min-width:40px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;gap:2px}
#personal-browser-concept .pb .pb-icon:hover{background:var(--pb-soft)}
#personal-browser-concept .pb .pb-icon[aria-pressed="true"]{background:var(--pb-soft);color:var(--pb-accent)}
#personal-browser-concept .pb .pb-icon svg{width:19px;height:19px}
#personal-browser-concept .pb .pb-icon small{font-size:11px}
#personal-browser-concept .pb .pb-address{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--pb-bg);border:1px solid var(--pb-line);color:var(--pb-muted);font-size:12px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#personal-browser-concept .pb .pb-toast{position:absolute;left:14px;right:14px;bottom:104px;padding:12px 15px;background:var(--pb-accent);color:var(--pb-onaccent);border-radius:12px;font-size:12px;z-index:5;box-shadow:0 3px 10px light-dark(#00000018,#00000040)}
#personal-browser-concept .pb[data-layout="home"] .pb-sheet{top:130px;border-radius:0;background:var(--pb-bg);box-shadow:none;padding-top:0;display:flex;flex-direction:column}
#personal-browser-concept .pb[data-layout="home"]:not([data-mode="browse"]) .pb-article{visibility:hidden}
#personal-browser-concept .pb[data-layout="home"] .pb-handle{display:none}
#personal-browser-concept .pb[data-layout="home"] .pb-sheet h3{font-size:29px;font-weight:400;margin-bottom:8px}
#personal-browser-concept .pb[data-layout="home"] .pb-sheet .pb-sub{margin-bottom:23px}
#personal-browser-concept .pb[data-layout="home"] .pb-sheet-footer{margin-top:auto}
#personal-browser-concept .pb .pb-search-form{margin:12px 4px 4px;display:flex;gap:7px}
#personal-browser-concept .pb .pb-search-input{width:100%;min-width:0;height:44px;padding:0 11px;border:1px solid var(--pb-line);border-radius:10px;background:var(--pb-bg);font-size:16px}
#personal-browser-concept .pb .pb-submit{background:var(--pb-accent);color:var(--pb-onaccent);min-width:44px;border-radius:10px;display:grid;place-items:center}
#personal-browser-concept .pb .pb-menu-action{display:flex;align-items:center;gap:11px;width:100%;min-height:49px;padding:0 9px;text-align:left;border-bottom:1px solid var(--pb-line)}
#personal-browser-concept .pb .pb-menu-action svg{width:19px;height:19px;color:var(--pb-muted)}
#personal-browser-concept .pb .pb-empty{padding:25px 7px;color:var(--pb-muted)}
@media(max-width:380px){#personal-browser-concept .pb-stage{padding:14px 0;min-height:674px}#personal-browser-concept .pb{border-radius:20px}#personal-browser-concept .pb .pb-dock{gap:1px;padding-left:6px;padding-right:6px}#personal-browser-concept .pb .pb-icon{width:38px;min-width:38px}#personal-browser-concept .pb .pb-close{width:34px}}
</style>
<script>
(()=>{
const root=document.getElementById('personal-browser-concept');
const seed=[
 {id:1,title:'Servo: an independent web engine',domain:'servo.org',url:'https://servo.org/',mark:'S',open:true,ago:'Now',saved:false},
 {id:2,title:'Kagi Search',domain:'kagi.com',url:'https://kagi.com/',mark:'K',open:true,ago:'3 min ago',saved:false},
 {id:3,title:'Karakeep — save what matters',domain:'karakeep.app',url:'https://karakeep.app/',mark:'K',open:false,ago:'18 min ago',saved:true},
 {id:4,title:'Hister — your own search engine',domain:'hister.org',url:'https://hister.org/',mark:'H',open:false,ago:'Yesterday',saved:false}
];
const archive=[{id:10,title:'Building Servo for Android',domain:'book.servo.org',url:'https://book.servo.org/building/android.html',mark:'S',open:false,ago:'3 weeks ago',saved:false},{id:11,title:'Karakeep API documentation',domain:'docs.karakeep.app',url:'https://docs.karakeep.app/api/karakeep-api/',mark:'K',open:false,ago:'Last month',saved:false}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const restored=window.openai?.widgetState?.privateContent?.previews||{};
const previews=[];
root.querySelectorAll('.pb').forEach(phone=>{
 const layout=phone.dataset.layout;
 const old=restored[layout]||{};
 const state={pages:structuredClone(seed),current:1,mode:'recent',query:'',toast:'',...old};
 if(!Array.isArray(state.pages)||!state.pages.length)state.pages=structuredClone(seed);
 if(!['recent','browse','search','archive','menu','settings'].includes(state.mode))state.mode='recent';
 let toastTimer;
 function persist(){if(!window.openai?.setWidgetState)return;const snapshots={};previews.forEach(p=>{snapshots[p.layout]={pages:p.state.pages,current:p.state.current,mode:p.state.mode,query:p.state.query};});window.openai.setWidgetState({modelContent:{concept:'Combray personal Android browser powered by Servo',variants:['Recent sheet','Recent home']},privateContent:{previews:snapshots}}).catch(()=>{});}
 function notify(message){state.toast=message;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{state.toast='';phone.querySelector('.pb-toast')?.remove();},2600);}
 function current(){return state.pages.find(p=>p.id===state.current)||state.pages[0];}
 function row(p){return '<div class="pb-page-row"><button type="button" class="pb-page-open cursor-interaction" data-open="'+p.id+'" aria-label="'+esc((p.open?'Switch to ':'Reopen ')+p.title)+'"><span class="pb-favicon">'+esc(p.mark)+'</span><span class="pb-copy"><span class="pb-title">'+esc(p.title)+'</span><span class="pb-meta">'+esc(p.domain)+' · '+esc(p.ago)+(p.open?'<span class="pb-live">Open</span>':'')+'</span></span></button>'+(p.open?'<button type="button" class="pb-close cursor-interaction" data-close="'+p.id+'" aria-label="Close '+esc(p.title)+'">'+icon('x')+'</button>':'')+'</div>';}
 function render(){
  phone.dataset.mode=state.mode;
  const page=current(),isRecent=state.mode==='recent',isSearch=state.mode==='search',isArchive=state.mode==='archive';
  const hasSheet=state.mode!=='browse';
  let contents='';
  if(isRecent){contents='<h3>Recent</h3><p class="pb-sub">Your open pages and the ones you left.</p>'+state.pages.slice(0,4).map(row).join('')+'<div class="pb-sheet-footer"><button type="button" class="pb-link cursor-interaction" data-action="archive">Search all history</button><button type="button" class="pb-plus cursor-interaction" data-action="search">+ New page</button></div>';}
  else if(isSearch||isArchive){
   const q=state.query.toLowerCase();const items=(isArchive?archive:state.pages).filter(p=>(p.title+' '+p.domain).toLowerCase().includes(q)).slice(0,3);
   contents='<h3>'+(isArchive?'All history':'Find a page')+'</h3><p class="pb-sub">'+(isArchive?'Search page contents with Hister.':'Recent pages, or a new Kagi search.')+'</p><div data-results>'+ (items.length?items.map(row).join(''):'<div class="pb-empty">No matching pages.</div>')+'</div><form class="pb-search-form"><input class="pb-search-input" aria-label="'+(isArchive?'Search Hister history':'Search or enter address')+'" placeholder="'+(isArchive?'Words you remember…':'Search or enter address')+'" value="'+esc(state.query)+'"><button type="submit" class="pb-submit cursor-interaction" aria-label="'+(isArchive?'Search history':'Search Kagi or open URL')+'">'+icon('arrow-right')+'</button></form><div class="pb-sheet-footer"><button type="button" class="pb-link cursor-interaction" data-action="recent">Recent</button><button type="button" class="pb-link cursor-interaction" data-action="'+(isArchive?'search':'kagi')+'">'+(isArchive?'Search the web':'Search Kagi')+'</button></div>';
  }else if(state.mode==='menu'){
   contents='<h3>This page</h3><p class="pb-sub">'+esc(page.domain)+'</p><button class="pb-menu-action cursor-interaction" data-action="save">'+icon('bookmark')+(page.saved?'Saved to Karakeep':'Save to Karakeep')+'</button><button class="pb-menu-action cursor-interaction" data-action="close-current">'+icon('x')+'Close page</button><button class="pb-menu-action cursor-interaction" data-action="archive">'+icon('history')+'Search all history</button><button class="pb-menu-action cursor-interaction" data-action="settings">'+icon('settings-2')+'Settings</button><div class="pb-sheet-footer"><button class="pb-link cursor-interaction" data-action="browse">Back to page</button></div>';
  }else if(state.mode==='settings'){
   contents='<h3>Combray</h3><p class="pb-sub">Connected services · illustrative settings</p><div class="pb-page-row"><span class="pb-copy"><span class="pb-title">Karakeep</span><span class="pb-meta">Quick save · URL and title</span></span></div><div class="pb-page-row"><span class="pb-copy"><span class="pb-title">Hister</span><span class="pb-meta">Full-text archive · excluded sites</span></span></div><div class="pb-page-row"><span class="pb-copy"><span class="pb-title">Kagi</span><span class="pb-meta">Default web search</span></span></div><div class="pb-sheet-footer"><button class="pb-link cursor-interaction" data-action="recent">Back to Recent</button></div>';
  }
  phone.innerHTML='<div class="pb-status" aria-hidden="true"><span>9:41</span><span>▰ ▴ ▰</span></div><article class="pb-article"><div class="pb-eyebrow">'+esc(page.domain)+'</div><h2>'+esc(page.id===1?'A different kind of web engine.':page.title)+'</h2><p>'+esc(page.id===1?'An independent engine. A browser shaped around the way you use the web.':'A sample page in your personal browser.')+'</p><div class="pb-art" aria-hidden="true"></div><div class="pb-rule" style="width:95%"></div><div class="pb-rule" style="width:86%"></div><div class="pb-rule" style="width:92%"></div></article>'+(hasSheet&&layout==='sheet'?'<div class="pb-scrim"></div>':'')+(hasSheet?'<section class="pb-sheet" aria-label="'+(isRecent?'Recent pages':'Browser panel')+'"><div class="pb-handle" aria-hidden="true"></div>'+contents+'</section>':'')+(state.toast?'<div class="pb-toast" role="status">'+esc(state.toast)+'</div>':'')+'<nav class="pb-dock" aria-label="Browser controls"><button type="button" class="pb-icon cursor-interaction" data-action="back" aria-label="Back">'+icon('arrow-left')+'</button><button type="button" class="pb-address cursor-interaction" data-action="search" aria-label="Search or enter address">'+esc(hasSheet?'Search or enter address':page.domain)+'</button><button type="button" class="pb-icon cursor-interaction" data-action="save" aria-label="Save to Karakeep" aria-pressed="'+page.saved+'">'+icon(page.saved?'bookmark-check':'bookmark')+'</button><button type="button" class="pb-icon cursor-interaction" data-action="recent" aria-label="Recent pages" aria-pressed="'+isRecent+'">'+icon('layers')+'<small>'+state.pages.filter(p=>p.open).length+'</small></button><button type="button" class="pb-icon cursor-interaction" data-action="menu" aria-label="More">'+icon('ellipsis')+'</button></nav>';
  if(globalThis.lucide)lucide.createIcons({root:phone,attrs:{width:18,height:18}});
 }
 function open(id){let p=state.pages.find(p=>p.id===id);if(!p){const a=archive.find(p=>p.id===id);if(!a)return;p={...a};state.pages.push(p);}const wasOpen=p.open;p.open=true;p.ago='Now';state.current=p.id;state.pages=[p,...state.pages.filter(x=>x.id!==p.id)];state.mode='browse';notify(wasOpen?'Switched to open page':'Reopened page');persist();}
 function close(id){const p=state.pages.find(p=>p.id===id);if(!p)return;p.open=false;p.ago='Just closed';if(state.current===id)state.current=(state.pages.find(x=>x.open)||p).id;notify('Closed · still in Recent');persist();}
 function searchWeb(){const q=state.query.trim();if(!q){state.mode='search';render();return;}const isUrl=/^https?:\/\//i.test(q)||/^[a-z0-9.-]+\.[a-z]{2,}(?:\/\S*)?$/i.test(q);const p={id:Date.now(),title:isUrl?q:'Kagi: '+q,domain:isUrl?q.replace(/^https?:\/\//,'').split('/')[0]:'kagi.com',url:isUrl?(/^https?:/.test(q)?q:'https://'+q):'https://kagi.com/search?q='+encodeURIComponent(q),mark:isUrl?q[0].toUpperCase():'K',open:true,ago:'Now',saved:false};state.pages.unshift(p);state.current=p.id;state.mode='browse';notify(isUrl?'Address opened · demo':'Kagi search opened · demo');persist();}
 phone.addEventListener('click',event=>{const btn=event.target.closest('button');if(!btn)return;if(btn.dataset.open){open(Number(btn.dataset.open));return;}if(btn.dataset.close){close(Number(btn.dataset.close));return;}const action=btn.dataset.action;
  if(action==='save'){const p=current();if(p.saved){notify('Already saved to Karakeep');return;}p.saved=true;notify('Saved to Karakeep · demo');persist();}
  else if(action==='close-current'){state.mode='recent';close(state.current);}
  else if(action==='kagi')searchWeb();
  else if(action==='back'){state.mode=state.mode==='browse'?'recent':'browse';state.query='';render();persist();}
  else if(action){state.mode=action;state.query='';state.toast='';render();persist();}
 });
 phone.addEventListener('input',event=>{if(!event.target.matches('.pb-search-input'))return;state.query=event.target.value;const q=state.query.toLowerCase();const source=state.mode==='archive'?archive:state.pages;const results=source.filter(p=>(p.title+' '+p.domain).toLowerCase().includes(q)).slice(0,3);phone.querySelector('[data-results]').innerHTML=results.length?results.map(row).join(''):'<div class="pb-empty">No matching pages.</div>';if(globalThis.lucide)lucide.createIcons({root:phone,attrs:{width:18,height:18}});persist();});
 phone.addEventListener('submit',event=>{event.preventDefault();if(state.mode==='archive'){notify('Hister results · sample data');}else searchWeb();});
 previews.push({layout,state,render});render();
 if(globalThis.Tweak){const design={rowHeight:65};const tweak=new Tweak({container:phone,onChange:()=>phone.style.setProperty('--pb-row-height',design.rowHeight+'px')});tweak.addSlider(design,'rowHeight',{label:'Recent row height',min:56,max:76,step:1,unit:'px'});}
});
window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent?.previews;if(!incoming)return;previews.forEach(p=>{const next=incoming[p.layout];if(!next||!Array.isArray(next.pages)||!next.pages.length)return;Object.assign(p.state,{pages:next.pages,current:next.current,mode:['recent','browse','search','archive','menu','settings'].includes(next.mode)?next.mode:'recent',query:next.query||'',toast:''});p.render();});});
})();
</script>
