# Copied from the pinned Servo release's .cargo/config.toml: Cargo configuration is not
# inherited from Servo's workspace, but Servo's crates need the same linkers and unstable gates.
[target.aarch64-linux-android]
linker = "aarch64-linux-android30-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android30-clang"

[env]
RUSTC_BOOTSTRAP = "crown,script,script_webgpu,script_bindings,style_tests,mozjs,mozjs_sys"
