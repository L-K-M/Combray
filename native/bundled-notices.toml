crate = "mozangle"
license = "BSD-3-Clause"
files = ["gfx/angle/checkout/LICENSE"]

[[library]]
name = "FreeType"
crate = "freetype-sys"
license = "FTL"
files = ["freetype2/LICENSE.TXT", "freetype2/docs/FTL.TXT"]

[[library]]
