# Shipped next to the engine as libc++_shared.so. The text is the LLVM section of the pinned
# NDK's NOTICE.toolchain: Apache-2.0, the LLVM exceptions and the legacy NCSA license.
[[library]]
name = "LLVM libc++"
ndk-notice = "The LLVM Project is under the Apache License v2.0 with LLVM Exceptions:"
ndk-notice-last-heading = "Legacy LLVM License (https://llvm.org/docs/DeveloperPolicy.html#legacy):"
requires-text = ["LLVM Exceptions to the Apache 2.0 License", "University of Illinois"]
license = "Apache-2.0 WITH LLVM-exception"

# Statically linked into libcombray_engine.so by the NDK's clang: libunwind (native/build.rs
# points -lgcc at it) and the compiler-rt builtins. Same LLVM text as libc++.
[[library]]
name = "LLVM libunwind and compiler-rt builtins"
ndk-notice = "The LLVM Project is under the Apache License v2.0 with LLVM Exceptions:"
ndk-notice-last-heading = "Legacy LLVM License (https://llvm.org/docs/DeveloperPolicy.html#legacy):"
requires-text = ["LLVM Exceptions to the Apache 2.0 License", "University of Illinois"]
license = "Apache-2.0 WITH LLVM-exception"

