# Code and data in the engine library that cargo-about cannot see: it reads crate metadata, not
# the sources a crate's build script compiles, the archive it downloads or the files it embeds.
# scripts/generate-notices.py reads each `files` entry from the named crate's registry source,
# each `repo-files` entry from this repository (code vendored here, with its `version`), and
# each `servo-files` entry from the pinned Servo checkout. `requires-text` lists phrases the
# texts must contain, so a changed source cannot silently shorten them.
#
# Found by listing the members and symbols of the linked static archives (SpiderMonkey's
# prebuilt libjs_static.a, the build-script outputs under target/<abi>/release/build). Recheck
# after changing the Servo pin or Cargo.lock. The engine's zlib is not listed: Android provides
# libz.so (pdfium.wasm builds in its own, listed below).

[[library]]
name = "SpiderMonkey"
crate = "mozjs_sys"
license = "MPL-2.0"
# Points to Firefox's license.html, which the crate does not ship; the MPL text follows it.
files = ["mozjs/LICENSE"]
spdx-text = "MPL-2.0"

[[library]]
name = "ICU"
crate = "mozjs_sys"
license = "Unicode-3.0"
# The prebuilt archive contains ICU4C; the crate ships no ICU license file.
spdx-text = "Unicode-3.0"

[[library]]
name = "double-conversion"
crate = "mozjs_sys"
license = "BSD-3-Clause"
files = ["mozjs/mfbt/double-conversion/LICENSE"]

[[library]]
