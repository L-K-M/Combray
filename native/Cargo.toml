[package]
name = "combray-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Unlicense"
publish = false
description = "Combray's Android bridge to a pinned, patched Servo (M0 engine spike)."

[lib]
name = "combray_engine"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Servo comes from the pinned downstream commit that `scripts/m0/fetch-servo.sh` prepares.
# Feature choices mirror servoshell's Android build (the configuration upstream CI exercises);
# trimming them is an M1 decision that needs its own build and size measurements.
[dependencies]
flate2 = "=1.1.9"
log = { version = "=0.4.34", features = ["release_max_level_info"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
url = "=2.5.8"

# Everything that touches Servo or JNI only builds for Android; host builds compile the pure
# modules so their unit tests run without a host Servo build.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "=0.15.1"
dpi = "=0.1.2"
euclid = "=0.22.14"
gleam = "=0.15.1"
http = "=1.5.0"
jni = "=0.22.4"
keyboard-types = { version = "=0.8.3", features = ["serde", "webdriver"] }
raw-window-handle = "=0.6.2"
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies.servo]
path = "../servo-checkout/servo/components/servo"
default-features = false
features = [
    "background_hang_monitor",
    "bluetooth",
    "bundled",
    "default_web_features",
    "gamepad",
    "js_jit",
    "testbinding",
    "webgl",
    "webgpu",
    "webxr",
]

# Android enforces tagged pointers in the system allocator, which SpiderMonkey does not
# tolerate (servo/servo#32175), so Servo's Android builds use jemalloc.
[target.'cfg(target_os = "android")'.dependencies.servo-allocator]
path = "../servo-checkout/servo/components/allocator"
features = ["use-jemalloc"]
