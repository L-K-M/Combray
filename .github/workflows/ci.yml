# CI: prove every push to main and every PR.
#
#   scripts — bash -n + shellcheck over scripts/*.sh, the scripts' regression
#             tests, rustfmt over native/ and a syntax check of the engine's
#             page scripts (always meaningful; none needs the Servo tree).
#   android — JVM tests, Android lint, debug + release APKs, the device
#             checks' test APK (compiled, not run), a check that Room's
#             exported schemas are committed, the third-party notices in
#             both APKs, and a debug APK uploaded as a rolling artifact. The
#             repo is set up before the app exists: until gradlew is committed
#             this job records a notice and passes, then turns itself on with
#             no workflow change.
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax and shellcheck
        run: |
          for f in scripts/*.sh scripts/m0/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh scripts/m0/servo-pin.sh scripts/m0/env.sh scripts/m0/fetch-servo.sh

      - name: APK build-script regressions
        run: python3 -I -m unittest discover -s scripts/tests

      # The harness's pure modules and fakes need only the standard library;
      # Playwright and Pillow are imported lazily and their tests skip here.
      - name: Site-check harness
        run: python3 -I -m unittest discover -s testing/sitecheck/tests -t testing/sitecheck

      # Formatting needs no Servo tree. The host unit tests (cargo test --lib)
      # do: Cargo reads the Android-only path dependencies into servo-checkout/,
      # so the Engine workflow runs them after fetching. The explicit toolchain skips the
      # Android targets rust-toolchain.toml lists.
      - name: Rust formatting
        working-directory: native
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$toolchain" ] || { echo "::error::could not read channel from native/rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          cargo "+$toolchain" fmt --check

      # The engine embeds these with include_str!, so a syntax error would only
      # show on a device (reader view finds no article, Hister capture stops,
      # pages lose Element.animate). The globs cover scripts added later.
      # vm.Script compiles each as the classic script Servo evaluates; `node
      # --check` would accept a top-level return. The placeholders the engine
      # fills in (__MAX_NODES__ and so on) are identifiers, so the templates
      # compile unfilled.
      - name: Engine page-script syntax
        run: |
          for f in native/src/*.js native/src/vendor/*.js; do
            node -e 'const file = process.argv[1]; new (require("vm").Script)(require("fs").readFileSync(file, "utf8"), { filename: file })' "$f"
          done

  android:
    name: Test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the Gradle project
        id: detect
        run: |
          if [ -x gradlew ] && [ -f app/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android project yet (gradlew / app/build.gradle.kts missing); skipping the Android build."
          fi

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # JDK 17 is the family default until M0 pins Combray's toolchain (AGENTS.md).
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # No SDK install step: the ubuntu runner image ships the Android SDK.
      # A compileSdk newer than the runner's AGP knows about also needs
      # android.suppressUnsupportedCompileSdk in gradle.properties.
      - if: steps.detect.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # assembleDebugAndroidTest compiles the device checks, which call core
      # APIs directly; lint does not compile them. Running them needs a device.
      - name: Test, lint, and assemble
        if: steps.detect.outputs.present == 'true'
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      # The build rewrites core/schemas from the entities. A changed or new file
      # means an entity changed without a committed schema; MigrationTest's
      # frozen hashes catch a changed schema that was committed.
      - name: Room schemas are committed
        if: steps.detect.outputs.present == 'true'
        run: |
          # Lists modified, deleted and new files alike, before failing.
          uncommitted="$(git status --porcelain -- core/schemas)"
          if [ -n "$uncommitted" ]; then
            echo "::error::Room schema files differ from what is committed:"
            echo "$uncommitted"
            exit 1
          fi

      # The release variant is the only one that runs R8, and R8 failures are
      # invisible until they aren't: prove the APK that gets released still
      # builds and shrinks on every PR, not once a tag is already pushed.
      - name: Assemble release (proves R8 / minification)
        if: steps.detect.outputs.present == 'true'
        run: ./gradlew assembleRelease

      # These APKs carry no engine, but the debug one is published below: both
      # must carry the third-party notices Settings › About shows. CI has no
      # signing key, so AGP names the release APK app-release-unsigned.apk.
      - name: Check third-party notices in the APKs
        if: steps.detect.outputs.present == 'true'
        run: |
          python3 -I scripts/verify-apk.py --notices-only app/build/outputs/apk/debug/app-debug.apk
          python3 -I scripts/verify-apk.py --notices-only app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combray-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
