# Temporary, manual investigation branch. Do not merge.
name: Engine
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ANDROID_NDK_ROOT: ""
  ANDROID_NDK_HOME: ""
jobs:
  capture:
    name: Encrypted live-page probe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare private output
        run: |
          mkdir -m 700 "$RUNNER_TEMP/probe-private"
          openssl version > "$RUNNER_TEMP/probe-private/crypto-version.txt"
      - name: Download verified diagnostic native build
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN: "41346084773"
          APK_ARTIFACT: combray-apk-x86_64-8a4c0a5d703007831be50837a15a1f50d464cc93
          APK_SHA256: bef9bc44f39ac81a1fe450140a1db53c930d50b504fb3740f635fbfaf6a6d44e
        run: |
          # A single named artifact extracts directly into the requested directory.
          gh run download "$APK_RUN" --repo "$GITHUB_REPOSITORY" --name "$APK_ARTIFACT" --dir "$RUNNER_TEMP/native-apk"
          echo "$APK_SHA256  $RUNNER_TEMP/native-apk/app-debug.apk" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          stage = pathlib.Path("spike/android/app/build/combray-jni/x86_64")
          stage.mkdir(parents=True)
          with zipfile.ZipFile(pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-apk/app-debug.apk") as archive:
              for name in ("libcombray_engine.so", "libc++_shared.so"):
                  with archive.open("lib/x86_64/" + name) as source, (stage / name).open("wb") as output:
                      shutil.copyfileobj(source, output)
          PY
      - name: Build the isolated M0 harness
        working-directory: spike/android
        run: ./gradlew assembleDebug
      - name: Require KVM and install emulator libraries
        run: |
          test -e /dev/kvm
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxcb1 libxext6 libxi6 libxrender1 libxtst6 \
            libgl1 libegl1 libpulse0 libglib2.0-0 libnss3 libnspr4 \
            libdbus-1-3 libxkbcommon0
      - name: Capture synthetic probes and the two supplied targets
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/probe-android
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/probe-android
          ANDROID_AVD_HOME: ${{ runner.temp }}/probe-android/avd
          COMBRAY_BOOT_TIMEOUT: "600"
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          scripts/m0/emulator.sh
          adb="$ANDROID_HOME/platform-tools/adb"
          serial=emulator-5560
          package=ch.lkmc.combray.enginespike
          activity=ch.lkmc.combray.enginespike/ch.lkmc.combray.spike.HarnessActivity
          apk=spike/android/app/build/outputs/apk/debug/app-debug.apk
          "$adb" -s "$serial" install -t "$apk"
          sha256sum "$apk" > "$RUNNER_TEMP/probe-private/harness.sha256"
          "$adb" -s "$serial" shell getprop ro.build.fingerprint > "$RUNNER_TEMP/probe-private/device.txt"
          python3 spike/diagnostic-fixtures/serve.py > "$RUNNER_TEMP/probe-private/fixture-server.log" 2>&1 &
          fixture_server=$!
          trap 'kill "$fixture_server" 2>/dev/null || true' EXIT
          "$adb" -s "$serial" reverse tcp:8768 tcp:8768
          failures=0
          index=0
          max_wait_attempts=220
          for url in \
            http://localhost:8768/message-identity.html \
            http://localhost:8768/policy-probe.html \
            http://localhost:8768/worker-failure.html \
            https://debug.challenges.cloudflare.com/ \
            https://help.openai.com/en/articles/20001625-understanding-chatgpt-and-codex-usage-limits
          do
            index=$((index + 1))
            out="$RUNNER_TEMP/probe-private/page-$index"
            mkdir -m 700 "$out"
            "$adb" -s "$serial" shell am force-stop "$package"
            "$adb" -s "$serial" shell run-as "$package" mkdir -p files/servo-profile
            "$adb" -s "$serial" shell run-as "$package" touch files/servo-profile/capture-page-errors
            "$adb" -s "$serial" shell run-as "$package" rm -f files/page-probe.json files/servo-profile/page-errors.jsonl
            "$adb" -s "$serial" shell am start -W -n "$activity" --es m0 page-probe --es arg "$url"
            ready=0
            for attempt in $(seq 1 "$max_wait_attempts"); do
              if "$adb" -s "$serial" shell run-as "$package" test -s files/page-probe.json; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" = 1 ]; then
              "$adb" -s "$serial" exec-out run-as "$package" cat files/page-probe.json > "$out/probe.json"
            else
              printf 'DOM probe unavailable\n' > "$out/status.txt"
              failures=$((failures + 1))
            fi
            "$adb" -s "$serial" exec-out run-as "$package" cat files/servo-profile/page-errors.jsonl > "$out/console.jsonl" 2> "$out/console-read.txt" || true
            "$adb" -s "$serial" exec-out screencap -p > "$out/screen.png"
            "$adb" -s "$serial" shell uiautomator dump /sdcard/probe-window.xml > "$out/hierarchy-status.txt" 2>&1 || true
            "$adb" -s "$serial" exec-out cat /sdcard/probe-window.xml > "$out/hierarchy.xml" 2>/dev/null || true
            "$adb" -s "$serial" logcat -d CombrayEngine:I AndroidRuntime:E '*:S' > "$out/engine-log.txt"
          done
          chrome="$(command -v google-chrome || true)"
          if [ -n "$chrome" ]; then
            for fixture in message-identity policy-probe; do
              "$chrome" --headless --no-sandbox --disable-gpu \
                --user-data-dir="$RUNNER_TEMP/chrome-$fixture" \
                --timeout=20000 --virtual-time-budget=15000 --dump-dom \
                "http://localhost:8768/$fixture.html" \
                > "$RUNNER_TEMP/probe-private/chrome-$fixture.html" \
                2> "$RUNNER_TEMP/probe-private/chrome-$fixture.log" || true
            done
          fi
          exit "$failures"
      - name: Encrypt captures before uploading
        if: always()
        run: |
          umask 077
          cp -r servo-checkout/logs "$RUNNER_TEMP/probe-private/emulator-logs" 2>/dev/null || true
          tar -C "$RUNNER_TEMP/probe-private" -czf "$RUNNER_TEMP/probe-private.tar.gz" .
          openssl cms -encrypt -binary -aes-256-gcm \
            -recip .github/diagnostic-recipient.pem \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/probe-private.tar.gz" -outform DER \
            -out "$RUNNER_TEMP/probe-captures.p7m"
      - name: Upload encrypted captures only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-engine-probe
          path: ${{ runner.temp }}/probe-captures.p7m
          if-no-files-found: error
          retention-days: 1
