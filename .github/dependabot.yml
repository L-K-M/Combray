version: 2
updates:
  # Workflow actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # App, core and engine modules. gradle/libs.versions.toml is a verified set: check each bump
  # with the unit tests, lint and scripts/check-app.sh on a device. No cargo entry on purpose:
  # native/Cargo.lock mirrors the pinned Servo release's lockfile (docs/BUILDING.md), and Servo
  # updates go through scripts/m0/fetch-servo.sh and the patch series.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Media3's modules move as one, and OkHttp moves with the version Media3's OkHttp data
    # source is built against: a major OkHttp update waits for Media3.
    groups:
      media3:
        patterns:
          - "androidx.media3:*"
    ignore:
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
