[project]
name = "combray-sitecheck"
version = "0.1.0"
description = "Loads websites in a local Servo build and in headless Chromium to find pages that do not work in Servo."
requires-python = ">=3.12"
license = "Unlicense"
# Exact pins: the reference engine's rendering and the image statistics feed
# the verdicts, so an unreviewed upgrade could change results between runs.
# Playwright's version also selects the Chromium build it downloads.
dependencies = [
    "pillow==13.0.0",
    "playwright==1.64.1",
]

[project.scripts]
sitecheck = "sitecheck.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitecheck"]
# probe.js and errors_userscript.js are loaded from the package at run time.
include = ["sitecheck/*.py", "sitecheck/*.js"]

[tool.hatch.build.targets.sdist]
include = ["sitecheck/", "tests/", "README.md", "seeds.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The (str, Enum) classes stay: StrEnum would change str() of their members, which
# the store and the JSON output read.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Log lines recorded from the real servoshell are kept verbatim.
"tests/test_servo.py" = ["E501"]
"tests/fixtures/fake_servoshell.py" = ["E501"]
